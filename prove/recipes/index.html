<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipes.css">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="All my recipes in one place">
    <meta property="og:url" content="https://bry443.github.io/wdd131/prove/recipes/index.html">
    <meta property="og:image" content="images/previewImage.png">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="All my recipes in one place">
    <meta name="twitter:image" content="images/previewImage.png">
    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">
    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <link href='https://fonts.googleapis.com/css?family=Amatic SC' rel='stylesheet'>
</head>
<body>
    <header>
        <div id="logo-container">
            <img src="images/recipeBook.png" alt="Recipe Book Logo" class="logo">
            <h1>RecipeBook</h1>
        </div>
        <div class="search-container">
            <input id="searchbar" name="searchbar" type="search" placeholder="Find a recipe" required />
            <img src="images/search.svg" alt="search icon" class="search-icon">
        </div>
        <hr>
    </header>
    <main>
        <section class="recipe-container">
            <div class="recipe-image">
                <img src="images/apple-crisp.jpg" alt="apple crisp with icecream">
            </div>
            <div class="recipe-description">
                <button class="foodType" type="button">dessert</button>
                <h1>Apple Crisp</h1>    
                    <span
                        class="rating"
                        role="img"
                        aria-label="Rating: 4 out of 5 stars"
                    >
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                    <p hidden class="recipeText">This apple crisp recipe is simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
            </div>
        </section>
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>   
    </footer>
</body>
</html>
